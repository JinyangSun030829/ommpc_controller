# 两个状态机共用的长方体安全区域配置，位置采用世界系 ENU，长度单位为米。
# 当前边界仅为示例，需根据实际实验场地修改；确认边界和保护策略前不要启用。
# 起飞原点、世界系目标起飞高度、起飞原点 Z 下方 0.1 m 的降落参考点，
# 均须位于有效区域内。本模块不处理障碍物，不保证实机无跟踪误差。
flight_box:
  # 区域保护开关：0/false 为关闭，保留原有刹停逻辑；1/true 为启用。
  enabled: 0
  # 原始长方体的世界系下界，依次为 [x_min, y_min, z_min]，单位 m。
  minimum: [-8.0, -8.0, -0.5]
  # 原始长方体的世界系上界，依次为 [x_max, y_max, z_max]，单位 m。
  maximum: [8.0, 8.0, 4.0]
  # 仅 X、Y 边界向内收缩的安全余量，单位 m；Z 上下界不收缩。
  # 有效 X 范围为 [x_min+margin_x, x_max-margin_x]，Y 方向同理。
  # 有效 Z 范围始终为 [z_min, z_max]，仍须包含起飞和降落参考高度。
  # 标量 0 表示不收缩（不是关闭保护）；标量 0.5 表示 X/Y 四个边界各向内缩 0.5 m。
  # 也可填写 [margin_x, margin_y]，分别设置 X、Y 的收缩量。
  # 兼容旧格式 [margin_x, margin_y, margin_z]，但第三项会被忽略，并输出提示。
  # 不设置时默认为 0；应为非负值，收缩后的水平空间不能为空。
  # 可用于预留水平机体尺寸、定位和跟踪误差；为 0 时没有额外水平位置误差缓冲。
  margin: 0.0
  # 刹停可行性及未来参考状态检查的间隔，单位 s；0.05 对应最多约 20 Hz。
  # 实际位置是否越过原始长方体边界，仍在每个控制周期检查。
  check_interval: 0.05
  # 向前预测参考轨迹的时间长度，单位 s；需不小于 reaction_time+check_interval。
  # 未来停车空间不足、但当前仍能认证安全刹停时，提前进入 BRAKE。
  lookahead: 0.50
  # 传感器、通信及执行器延迟的预留时间，单位 s；评估时还会加上 check_interval。
  # 沿当前参考轨迹推进，并叠加实际位置偏差和速度偏差的线性预测；不再固定加速度外推。
  # 检查延迟后是否仍存在区域内可认证的停止方案；不是实际扰动的严格上界。
  reaction_time: 0.15
  # 预测窗口内等间隔检查的未来参考状态数量，取值 1~8。
  # 当前值 2、lookahead=0.5 时，检查未来 0.25 s 和 0.5 s；不是连续时间认证。
  # 增大会提高预测检查密度，同时增加计算量。
  lookahead_samples: 2
  # 候选刹停曲线允许的最大持续时间，单位 s；不是实际刹停时间的固定设定。
  # 超出该时间的候选不搜索；实际选用曲线的时间由状态和加速度/jerk 限制决定。
  max_stop_duration: 12.0
  # 刹停持续时间候选的最大搜索次数，取值 8~120。
  # 当前算法从 0.05 s 开始，每次乘 1.075；达到次数或最大持续时间即停止搜索。
  # 每个持续时间还会尝试不同终点；增大次数不等于一定找到可行曲线。
  duration_trials: 80
  # Bernstein 曲线边界认证的最大递归细分深度，取值 1~10。
  # 用细分后的控制点凸包检查整条路径及加速度/jerk 上限，不仅检查离散点。
  # 增大会降低保守性，但增加计算量；达到深度仍不能认证的候选会被拒绝。
  subdivision_depth: 6
  # 沿原轨迹逐步降速时，重建的分段制动曲线数量，取值 4~64。
  # 每段保持位置/速度/加速度连续，并认证整段区域、加速度及 jerk；不是仅检查采样点。
  # 16 为默认值；增大可改善曲线近似，但增加搜索和控制回调耗时。
  # 只在区域保护启用且有可预览轨迹时尝试；失败后仍搜索通用区域内制动方案。
  path_stop_segments: 16

# 加速度与 jerk 上限仍分别读取两个控制器原有配置中的 braking 参数。
# 若当前状态找不到可认证的区域内刹停曲线，程序会锁定故障并停止控制话题输出，
# 不自动上锁或请求正常降落；后续响应取决于 PX4 的 OFFBOARD 丢失保护设置。
# 有限搜索失败不代表数学上不存在其他可行解；启用前必须验证上述保护设置。
